name: stillroom

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stillroom}
      POSTGRES_USER: ${POSTGRES_USER:-stillroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - stillroom-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      user: ${POSTGRES_USER:-stillroom}
      password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      host: db
      port: 5432
      dbname: ${POSTGRES_DB:-stillroom}
      DATABASE_SSL: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      FRONTEND_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      FRONTEND_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-stillroom@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
      BACKUP_DIR: /backups
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.app:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"]
    volumes:
      - ./backups:/backups:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      user: ${POSTGRES_USER:-stillroom}
      password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      host: db
      port: 5432
      dbname: ${POSTGRES_DB:-stillroom}
      DATABASE_SSL: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      FRONTEND_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      FRONTEND_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
    command: ["python", "-m", "app.worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://api:8000
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - stillroom-caddy-data:/data
      - stillroom-caddy-config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  stillroom-db:
  stillroom-caddy-data:
  stillroom-caddy-config: