[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "ollama>=0.6.2",
    "pgvector>=0.4.2",
    "pwdlib[argon2]>=0.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.12.1",
    "uvicorn[standard]>=0.46.0",
    "jsonschema>=4.23",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Migration files are generated snapshots; keep their import order as written.
"alembic/versions/*" = ["E501", "I001"]
# These modules are being split in Phase 2. Long prompt strings and logger
# calls are left alone rather than reformatted in the same commit as a change.
"app/routes/*" = ["E501"]
"app/services/*" = ["E501"]
"app/models/*" = ["E501"]

